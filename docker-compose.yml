# Development stack: MySQL + Django (runserver, live-reload via bind mount)
# + React (Vite dev server, hot module reload).
#
# Usage:
#   cp .env.example .env   (fill in real values)
#   docker compose up --build
#
# Backend:  http://localhost:8000
# Frontend: http://localhost:5173
# Admin:    http://localhost:8000/admin/

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SECRET_KEY: ${DJANGO_SECRET_KEY}
      DEBUG: "True"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 3306
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Overrides the Dockerfile's gunicorn CMD with the dev server, and runs
    # migrations automatically on startup so a fresh `docker compose up` just works.
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules   # anonymous volume: keeps the container's Linux
                             # node_modules from being clobbered by a Windows/Mac bind mount
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data:
