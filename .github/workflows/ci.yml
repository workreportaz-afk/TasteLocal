name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: tastelocal_test
          MYSQL_ROOT_PASSWORD: root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot_test_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        env:
          SECRET_KEY: ci-test-secret-key
          DEBUG: "True"
          DB_NAME: tastelocal_test
          DB_USER: root
          DB_PASSWORD: root_test_password
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
        run: python manage.py check

      - name: Run migrations
        env:
          SECRET_KEY: ci-test-secret-key
          DEBUG: "True"
          DB_NAME: tastelocal_test
          DB_USER: root
          DB_PASSWORD: root_test_password
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
        run: python manage.py migrate

      - name: Run tests
        env:
          SECRET_KEY: ci-test-secret-key
          DEBUG: "True"
          DB_NAME: tastelocal_test
          DB_USER: root
          DB_PASSWORD: root_test_password
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
        run: python manage.py test

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build production bundle
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t tastelocal-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t tastelocal-frontend:ci ./frontend
