<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TasteLocal — Backend</title>
  <style>
    :root { --primary: #d1495b; --dark: #1f2937; --muted: #6b7280; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: "Segoe UI", system-ui, sans-serif; background: #fafafa; color: var(--dark);
    }
    .card {
      background: white; border-radius: 14px; padding: 2.5rem; max-width: 480px; width: 90%;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08); text-align: center;
    }
    h1 { margin: 0 0 0.25rem; }
    h1 span { color: var(--primary); }
    .subtitle { color: var(--muted); margin: 0 0 1.75rem; }
    .badge {
      display: inline-block; font-size: 0.75rem; font-weight: 600; padding: 0.2rem 0.6rem;
      border-radius: 12px; margin-bottom: 1.5rem;
    }
    .badge.debug { background: #fef3c7; color: #92400e; }
    .badge.prod { background: #d1fae5; color: #065f46; }
    .links { display: flex; flex-direction: column; gap: 0.75rem; }
    .links a {
      display: block; padding: 0.75rem 1rem; border-radius: 8px; text-decoration: none;
      font-weight: 600; border: 1px solid #eee; color: var(--dark); transition: background 0.15s;
    }
    .links a:hover { background: #f9f9f9; }
    .links a.primary { background: var(--primary); color: white; border-color: var(--primary); }
    .links a.primary:hover { background: #b83d4d; }
    footer { margin-top: 1.75rem; font-size: 0.8rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Taste<span>Local</span></h1>
    <p class="subtitle">Backend API server</p>
    <span class="badge {% if debug %}debug{% else %}prod{% endif %}">
      {% if debug %}DEBUG mode{% else %}Production mode{% endif %}
    </span>

    <div class="links">
      <a class="primary" href="{{ frontend_url }}">🍜 Open the frontend app</a>
      <a href="/admin/">⚙️ Django admin</a>
      <a href="/api/experiences/">🔌 API root (/api/experiences/)</a>
    </div>

    <footer>You're viewing the backend directly — most people want the frontend link above.</footer>
  </div>
</body>
</html>
